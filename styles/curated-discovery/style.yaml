# Declarative runtime constraints plus a non-runtime documentation-module index.
# Edit constraints here. The modules list only maintains the readable legacy style reference.
id: curated-discovery
title: Curated Discovery
modules:
  - file: 01-style-interface.md
    heading: "## Style interface"
  - file: 02-writing-reference-profile.md
    heading: "## Writing reference profile"
  - file: 03-core-principle-digest-first-reading.md
    heading: "## Core principle: Digest-first reading"
  - file: 04-curation-process.md
    heading: "## Curation process"
  - file: 05-relationship-between-sources.md
    heading: "## Relationship between sources"
  - file: 06-editorial-depth.md
    heading: "## Editorial depth"
  - file: 07-understanding-over-extraction.md
    heading: "## Understanding over extraction"
  - file: 08-writing-character.md
    heading: "## Writing character"
  - file: 09-length-and-density.md
    heading: "## Length and density"
  - file: 10-required-structure.md
    heading: "## Required structure"
  - file: 11-optional-depth-cue.md
    heading: "## Optional depth cue"
  - file: 12-organization.md
    heading: "## Organization"
  - file: 13-citations.md
    heading: "## Citations"
  - file: 14-section-level-source-lines.md
    heading: "## Section-level source lines"
  - file: 15-final-source-catalog.md
    heading: "## Final source catalog"
  - file: 16-ending-rules.md
    heading: "## Ending rules"
  - file: 17-quality-control.md
    heading: "## Quality control"

constraints:
  version: 1

  # The stages that receive this style's interface declaration (styles/<style>/interface.md).
  # One owner: this list. The legacy profile routed the interface module to exactly these
  # stages, so the delivery set is unchanged.
  interface_stages:
    - frame
    - draft
    - copy-verify
    - developmental-review
    - reader-review

  composition:
    unit: editorial_mini_essay
    description: a coherent editorial mini-essay built around one idea worth understanding
    relationship: independent-by-default
    min_sources_per_unit: 1
    max_sources_per_unit: 1
    min_units: 1
    max_units:
    opening: TODAY'S EDIT
    catalog: required

  body:
    unit: document
    min_words: 700
    max_words: 1200
    prose: about 700-1,200 words for the briefing body, excluding the source catalog

  citations:
    mode: numeric
  catalog:
    required: true
  callouts: {}
  enforced: []
  evaluation:
    metric: reader_quality_v4
    rubric: v4
    steps_version: v4.0-style-diagnostics
    developmental: developmental_review_v1
    style_criteria: []
  rendering:
    rules: styles/curated-discovery/rendering.md
    template: templates/curated-discovery-email-v1.html
