# Synthesis MAX — style manifest, execution profile and declarative constraints.
#
# Two things live in this file, each with one owner:
#
# 1. ``profile`` — the style's execution policy: its profile id, version, label,
#    status and frame-failure behaviour. It is the only active profile declaration
#    for this style.
# 2. ``constraints`` — the declarative style facts of the new instruction
#    architecture. Python validators consume these values directly; the prompt
#    composer resolves them into one compact <style_constraints> block when a
#    stage needs them. Editorial judgment and procedure live in the Markdown
#    files; constraints live here.
#
# Derived from the validated behaviour of the Synthesis MAX implementation
# (composition constraints, budgets, and the enforced validator set). Changing a
# value here changes what the deterministic validators accept — it is a
# behavioural change, not a wording change.

id: synthesis-max
title: Synthesis MAX

profile:
  id: synthesis-max-v1
  version: 2.1.0
  label: Synthesis MAX
  status: active
  frame_failure_policy: fail
  notes:
    - The active Synthesis MAX execution policy.
    - Editorial instructions and constraints resolve from the synthesis-max style tree.
    - Frame failures stop rather than deriving a recovery frame.

constraints:
  version: 1

  # The stages that receive this style's interface declaration (styles/<style>/interface.md).
  # One owner: this list. The legacy profile routed the interface module to exactly these
  # stages, so the delivery set is unchanged.
  interface_stages:
    - analyze
    - frame
    - draft
    - publication-verify
    - developmental-review
    - reader-review

  composition:
    unit: synthesized_thread
    description: a concrete topic, question, mechanism, development, or tension explained through at least two substantively contributing sources
    relationship: mandatory
    min_sources_per_unit: 2
    max_sources_per_unit: 4
    min_units: 1
    max_units: 4
    opening: THE BIG PICTURE
    catalog: required
    catalog_only_allowed: true

  body:
    unit: document
    min_words: 700
    max_words: 1200
    prose: about 700-1,200 words for the briefing body, excluding the source catalog
    # The plan may spend at most (1 - headroom) of the maximum; the reserve is editing headroom.
    budget_headroom_ratio: 0.15
    opening_min_words: 80
    opening_max_words: 130
    # A source needs at least roughly one explanatory sentence of space.
    min_words_per_source: 60
    comfortable_words_per_source: 100

  citations:
    mode: numeric

  catalog:
    required: true
    grouping_default: source-identity

  callouts:
    max_per_unit: 1

  # The deterministic checks this style's validators run. One owner: this list.
  enforced:
    - edition_mode
    - unit_count.min
    - unit_count.max
    - sources_per_unit.min
    - sources_per_unit.max
    - sources_per_unit.exists
    - unit:source_roles
    - unit:progression
    - unit:explanation_shape
    - unit:budget_present
    - unit:evidence_fits_budget
    - opening_words
    - arithmetic
    - analysis_clusters

  # The semantic evaluation this style is judged against.
  evaluation:
    metric: reader_quality_v4
    rubric: v4
    steps_version: v4.0-style-diagnostics
    developmental: developmental_review_v1
    style_criteria: []

  rendering:
    rules: styles/synthesis-max/rendering.md
    template: templates/synthesis-max-email-v1.html
