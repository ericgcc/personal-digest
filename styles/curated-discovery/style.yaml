# Curated Discovery — style manifest, execution profile and declarative constraints.
#
# The style directory is retained, but its legacy profile and legacy stage
# implementations were removed. This is a minimal new-architecture style
# definition: it declares the style's execution policy and the declarative
# constraints its validators consume. Curated Discovery will be rebuilt fresh
# against the new architecture later.
id: curated-discovery
title: Curated Discovery

profile:
  id: curated-discovery-v1
  version: 1.0.0
  label: Curated Discovery
  status: unavailable
  frame_failure_policy: recovery-frame
  notes:
    - A minimal new-architecture Curated Discovery definition.
    - Editorial instructions and constraints resolve from the curated-discovery style tree.
    - The legacy profile and legacy stage implementations were removed.
    - The style awaits a fresh implementation against the new architecture; it is not runnable.

constraints:
  version: 1

  # The stages that receive this style's interface declaration (styles/<style>/interface.md).
  # One owner: this list. The legacy profile routed the interface module to exactly these
  # stages, so the delivery set is unchanged.
  interface_stages:
    - frame
    - draft
    - publication-verify
    - developmental-review
    - reader-review

  composition:
    unit: editorial_mini_essay
    description: a coherent editorial mini-essay built around one idea worth understanding
    relationship: independent-by-default
    min_sources_per_unit: 1
    max_sources_per_unit: 1
    min_units: 1
    max_units:
    opening: TODAY'S EDIT
    catalog: required

  body:
    unit: document
    min_words: 700
    max_words: 1200
    prose: about 700-1,200 words for the briefing body, excluding the source catalog

  citations:
    mode: numeric
  catalog:
    required: true
  callouts: {}
  enforced: []
  evaluation:
    metric: reader_quality_v4
    rubric: v4
    steps_version: v4.0-style-diagnostics
    developmental: developmental_review_v1
    style_criteria: []
  rendering:
    rules: styles/curated-discovery/rendering.md
    template: templates/curated-discovery-email-v1.html
