# Declarative runtime constraints plus a non-runtime documentation-module index.
# Edit constraints here. The modules list only maintains the readable legacy style reference.
id: concise
title: Concise
modules:
  - file: 01-style-interface.md
    heading: "## Style interface"
  - file: 02-writing-reference-profile.md
    heading: "## Writing reference profile"
  - file: 03-summary-mode.md
    heading: "## Summary mode"
  - file: 04-writing-character.md
    heading: "## Writing character"
  - file: 05-length-and-density.md
    heading: "## Length and density"
  - file: 06-required-structure.md
    heading: "## Required structure"
  - file: 07-selection-and-filtering.md
    heading: "## Selection and filtering"
  - file: 08-fidelity.md
    heading: "## Fidelity"
  - file: 09-ending-rules.md
    heading: "## Ending rules"
  - file: 10-quality-control.md
    heading: "## Quality control"

constraints:
  version: 1

  # The stages that receive this style's interface declaration (styles/<style>/interface.md).
  # One owner: this list. The legacy profile routed the interface module to exactly these
  # stages, so the delivery set is unchanged.
  interface_stages:
    - frame
    - draft
    - copy-verify
    - developmental-review
    - reader-review

  composition:
    unit: independent_source
    description: one independent source or retained item
    relationship: independent
    min_sources_per_unit: 1
    max_sources_per_unit: 1
    min_units: 1
    max_units:
    opening:
    catalog: not-required

  body:
    unit: per_source
    min_words: 40
    max_words: 80
    prose: about 40-80 words per retained source entry

  citations:
    mode: source_identity
  catalog:
    required: false
  callouts: {}
  enforced: []
  evaluation:
    metric: reader_quality_v4
    rubric: v4
    steps_version: v4.0-style-diagnostics
    developmental: developmental_review_v1
    style_criteria: []
  rendering:
    rules: styles/concise/rendering.md
    template: templates/concise-email-v1.html
