# Synthesis MAX — style manifest and declarative constraints.
#
# Two things live in this file, each with one owner:
#
# 1. ``modules`` — the ordered module manifest for the legacy architecture
#    (generated by scripts/build_style_docs.py; do not edit by hand).
# 2. ``constraints`` — the declarative style facts of the new instruction
#    architecture. Python validators consume these values directly; the prompt
#    composer resolves them into one compact <style_constraints> block when a
#    stage needs them. Editorial judgment and procedure live in the Markdown
#    files; constraints live here.
#
# Derived from the validated behaviour of synthesis-max-v1 (composition
# constraints, budgets, and the enforced validator set). Changing a value here
# changes what the deterministic validators accept — it is a behavioural change,
# not a wording change.

id: synthesis-max
title: Synthesis MAX
modules:
  - file: 01-style-interface.md
    heading: "## Style interface"
  - file: 02-writing-reference-profile.md
    heading: "## Writing reference profile"
  - file: 03-synthesis-mode.md
    heading: "## Synthesis mode"
  - file: 04-writing-character.md
    heading: "## Writing character"
  - file: 05-domain-accessibility-in-synthesis.md
    heading: "## Domain accessibility in synthesis"
  - file: 06-length-and-density.md
    heading: "## Length and density"
  - file: 07-required-structure.md
    heading: "## Required structure"
  - file: 08-citations.md
    heading: "## Citations"
  - file: 09-final-source-catalog.md
    heading: "## Final source catalog"
  - file: 10-ending-rules.md
    heading: "## Ending rules"
  - file: 11-quality-control.md
    heading: "## Quality control"

constraints:
  version: 1

  composition:
    # What one editorial unit is, in one phrase. Prose elaboration lives in the stage files.
    unit: synthesized_thread
    relationship: synthesis_required
    min_sources_per_unit: 2
    max_sources_per_unit: 4
    min_units: 1
    max_units: 4
    catalog_only_allowed: true

  body:
    # The briefing body, excluding the source catalog.
    min_words: 700
    max_words: 1200
    # The plan may spend at most (1 - headroom) of the maximum; the reserve is editing headroom.
    budget_headroom_ratio: 0.15
    opening_min_words: 80
    opening_max_words: 130
    # A source needs at least roughly one explanatory sentence of space.
    min_words_per_source: 60
    comfortable_words_per_source: 100

  citations:
    mode: numeric

  catalog:
    required: true
    grouping_default: source-identity

  callouts:
    max_per_unit: 1

  # The deterministic checks this style's validators run. One owner: this list.
  enforced:
    - edition_mode
    - unit_count.min
    - unit_count.max
    - sources_per_unit.min
    - sources_per_unit.max
    - sources_per_unit.exists
    - unit:source_roles
    - unit:progression
    - unit:explanation_shape
    - unit:budget_present
    - unit:evidence_fits_budget
    - opening_words
    - arithmetic
    - analysis_clusters

  # The semantic evaluation this style is judged against.
  evaluation:
    metric: reader_quality_v4
    rubric: v4
    steps_version: v4.0-style-diagnostics
    developmental: developmental_review_v1

  rendering:
    rules: styles/synthesis-max/rendering.md
    template: templates/synthesis-max-email-v1.html

