<!doctype html>
<html lang="{{HTML_LANG}}" style="min-width:100%;background:#d1deec">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="x-apple-disable-message-reformatting">
  <title>{{DIGEST_NAME}} — {{DATE}}</title>
  <style>
    body,table,td,a{-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%}
    table,td{mso-table-lspace:0;mso-table-rspace:0;border-collapse:collapse}
    body{margin:0!important;padding:0!important;width:100%!important;background:#d1deec;color:#27364a}
    a{text-decoration:none}.preheader{display:none!important;visibility:hidden;opacity:0;color:transparent;height:0;width:0;overflow:hidden;mso-hide:all}
    .wrap{width:100%;background:#d1deec}.card{width:100%;max-width:720px;background:#fff;border-radius:14px}.inner{width:100%;max-width:596px}
    .serif{font-family:Georgia,'Times New Roman',serif}.bodycopy{font-family:Arial,Helvetica,sans-serif;color:#34445a}
    .rule{height:1px;background:#e4e9f0;line-height:1px;font-size:1px}
    .source-kicker{font:700 10px/17px Arial,Helvetica,sans-serif;color:#315fe7;letter-spacing:.9px;text-transform:uppercase}.source-time{margin-top:3px;font:12px/18px Arial,Helvetica,sans-serif;color:#8a96a7}
    .source-title{color:#17263a!important;text-decoration:none}.source-title:hover{text-decoration:underline}
    .summary{font:15px/24px Arial,Helvetica,sans-serif;color:#435168}
    .read-capsule{display:inline-block;border:1px solid #f0c88a;border-radius:18px;background:#fff9ef;padding:6px 14px;font:700 13px/18px Arial,Helvetica,sans-serif;color:#9b5b19;max-width:100%;box-sizing:border-box}
    .source-rail{width:132px;padding-right:22px;vertical-align:top}
    .source-copy{padding-left:24px;border-left:1px solid #dfe5ed;vertical-align:top}
    .mobile-accent{display:none;height:3px;width:30px;background:#315fe7;line-height:3px;font-size:1px;border-radius:2px;margin-top:8px}
    @media(max-width:760px){
      .outer-pad{padding-left:12px!important;padding-right:12px!important}.content-pad{padding-left:36px!important;padding-right:36px!important}.card{border-radius:8px!important}
      .headline{font-size:32px!important;line-height:40px!important}.brief-title{font-size:21px!important;line-height:28px!important}
      .source-rail{width:112px!important;padding-right:16px!important}.source-copy{padding-left:18px!important}
    }
    @media(max-width:519px){
      .outer-pad{padding-left:8px!important;padding-right:8px!important}.content-pad{padding-left:22px!important;padding-right:22px!important}
      .headline{font-size:29px!important;line-height:36px!important}.brief-title{font-size:21px!important;line-height:28px!important}
      .masthead-row>td{display:block!important;width:100%!important;text-align:left!important}.masthead-date{padding-top:4px!important;text-align:left!important}
      .read-capsule{white-space:normal!important;text-align:center!important;line-height:20px!important}
      .brief-row>td{display:block!important;width:100%!important}
      .source-rail{width:100%!important;padding:0 0 12px!important}
      .source-copy{padding:0!important;border-left:0!important}
      .mobile-accent{display:block!important}
      .brief-entry{padding-top:23px!important;padding-bottom:24px!important}
      .summary{font-size:15.5px!important;line-height:24px!important}
    }
  </style>
</head>
<body style="margin:0;padding:0;background:#d1deec">
<div class="preheader">{{PREHEADER}}</div><table role="presentation" class="wrap" width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td class="outer-pad" align="center" style="padding:28px 18px 42px"><table role="presentation" class="card" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:720px;background:#fff;border-radius:14px;box-shadow:0 10px 30px rgba(39,54,74,.10)"><tr><td style="height:5px;background:#2376dc;border-radius:14px 14px 0 0"></td></tr>
<!-- STRUCTURAL SPECIMEN ONLY. Repeat the entry for retained sources; this template does not imply an item count. -->
<tr><td class="content-pad" style="padding:30px 62px 18px"><table role="presentation" class="inner" width="100%"><tr class="masthead-row"><td style="font:700 13px/20px Arial,Helvetica,sans-serif;color:#2376dc;letter-spacing:1.1px;text-transform:uppercase">{{PUBLICATION_LABEL}}</td><td class="masthead-date" align="right" style="font:14px/20px Arial,Helvetica,sans-serif;color:#7d899b">{{DATE}}</td></tr></table></td></tr><tr><td class="content-pad" style="padding:8px 62px 30px"><table role="presentation" class="inner" width="100%"><tr><td><h1 class="headline serif" style="margin:0 0 12px;font-size:38px;line-height:46px;color:#17263a">{{DIGEST_NAME}}</h1><p style="margin:0 0 22px;font:16px/26px Arial,Helvetica,sans-serif;color:#66758a">{{DIGEST_PURPOSE}}</p></td></tr><tr><td align="center"><span class="read-capsule">{{SOURCE_TIME}} → {{DIGEST_TIME}} · ⚡ {{SAVED_LABEL}} ~{{TIME_SAVED}}</span></td></tr></table></td></tr><tr><td class="content-pad" style="padding:0 62px"><div class="rule">&nbsp;</div></td></tr>
<!-- REPEATABLE CONCISE ENTRY -->
<tr><td class="content-pad brief-entry" style="padding:27px 62px 28px"><table role="presentation" class="inner" width="100%"><tr class="brief-row"><td class="source-rail" width="132"><div class="source-kicker">{{SOURCE_IDENTITY}}</div><div class="source-time">{{SOURCE_READING_TIME}}</div><div class="mobile-accent">&nbsp;</div></td><td class="source-copy"><h2 class="brief-title serif" style="margin:0 0 8px;font-size:22px;line-height:29px;color:#17263a">{{SOURCE_TITLE_HTML}}</h2><p class="summary" style="margin:0">{{CONCISE_SUMMARY}}</p></td></tr></table></td></tr>
<tr><td style="background:#17263a;border-radius:0 0 14px 14px;padding:20px 30px;text-align:center;font:12px/18px Arial,Helvetica,sans-serif;color:#aab4c2">{{FOOTER}}</td></tr></table></td></tr></table><!-- run-key: {{RUN_KEY}} -->
</body>
</html>
